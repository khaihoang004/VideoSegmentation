[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videosegmentation"
version = "0.1.0"
description = "Download video research datasets directly to Google Drive from Colab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "gdown>=5.2,<6",
  "huggingface_hub>=0.34,<2",
  "tqdm>=4.66,<5",
]

[project.scripts]
videoseg = "videosegmentation.cli:main"

[tool.setuptools.packages.find]
include = ["videosegmentation*", "downloaders*"]
