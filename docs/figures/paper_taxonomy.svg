   <g id="text_1">
    <text style="fill: #172338; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="28.8" y="38.632656" transform="rotate(-0 28.8 38.632656)">Bản đồ paper: 8 nhóm theo bài toán chính</text>
   </g>
   <g id="text_2">
    <text style="fill: #526277; font: 12px 'DejaVu Sans'; text-anchor: start" x="28.8" y="62.344688" transform="rotate(-0 28.8 62.344688)">23 paper • một nhóm chính mỗi bài; kỹ thuật giao nhau xem ma trận thành phần</text>
   </g>
   <g id="text_3">
    <text style="fill: #172338; font: 700 17px 'DejaVu Sans'; text-anchor: middle" x="504" y="110.804531" transform="rotate(-0 504 110.804531)">Định vị online toàn lượt công việc</text>
   </g>
   <g id="text_4">
    <text style="fill: #172338; font: 11px 'DejaVu Sans'; text-anchor: middle" x="504" y="128.064531" transform="rotate(-0 504 128.064531)">Exocentric • nhiều lượt • pause/repair • completion</text>
   </g>
   <g id="text_5">
    <text style="fill: #2563eb; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="43.2" y="188.735625" transform="rotate(-0 43.2 188.735625)">G1 · Định vị action online</text>
   </g>
   <g id="text_6">
    <text style="fill: #172338; font: 11.2px 'DejaVu Sans'; text-anchor: start" x="43.2" y="212.6105" transform="rotate(-0 43.2 212.6105)">P01 OnPoint · P02 DUGO · P07 OZ-TAL · P11 HAT · P18 MATR</text>
   </g>
   <g id="text_7">
    <text style="fill: #172338; font: 10.8px 'DejaVu Sans'; text-anchor: start" x="43.2" y="251.840812" transform="rotate(-0 43.2 251.840812)">Xử lý: Nhiều interval; history/memory; ít nhãn hoặc zero-shot.</text>
   </g>
   <g id="text_8">
    <text style="fill: #526277; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="43.2" y="281.747344" transform="rotate(-0 43.2 281.747344)">Giới hạn: Action end chưa mặc định là hoàn thành toàn công việc.</text>
   </g>
   <g id="text_9">
    <text style="fill: #0891b2; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="554.4" y="188.982422" transform="rotate(-0 554.4 188.982422)">G2 · Frame, step và boundary</text>
   </g>
   <g id="text_10">
    <text style="fill: #172338; font: 11.2px 'DejaVu Sans'; text-anchor: start" x="554.4" y="212.6105" transform="rotate(-0 554.4 212.6105)">P05 Online GEBD · P06 CMeRT · P10 OnlineTAS</text>
   </g>
   <g id="text_11">
    <text style="fill: #172338; font: 10.8px 'DejaVu Sans'; text-anchor: start" x="554.4" y="251.650969" transform="rotate(-0 554.4 251.650969)">Xử lý: Nhãn frame, segmentation hoặc boundary candidates.</text>
   </g>
   <g id="text_12">
    <text style="fill: #526277; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="554.4" y="282.063164" transform="rotate(-0 554.4 282.063164)">Giới hạn: Đổi thao tác/nghỉ chưa phải kết thúc một lượt.</text>
   </g>
   <g id="text_13">
    <text style="fill: #7c3aed; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="43.2" y="347.943516" transform="rotate(-0 43.2 347.943516)">G3 · Phân cấp và tiến trình</text>
   </g>
   <g id="text_14">
    <text style="fill: #172338; font: 11.2px 'DejaVu Sans'; text-anchor: start" x="43.2" y="371.0105" transform="rotate(-0 43.2 371.0105)">P03 OpenHOUSE · P12 ProTAS</text>
   </g>
   <g id="text_15">
    <text style="fill: #172338; font: 10.8px 'DejaVu Sans'; text-anchor: start" x="43.2" y="410.050969" transform="rotate(-0 43.2 410.050969)">Xử lý: Substep–step–goal; action progress và task graph.</text>
   </g>
   <g id="text_16">
    <text style="fill: #526277; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="43.2" y="440.463164" transform="rotate(-0 43.2 440.463164)">Giới hạn: Hiểu goal/tiến trình chưa xác nhận đã đạt goal.</text>
   </g>
   <g id="text_17">
    <text style="fill: #059669; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="554.4" y="347.382422" transform="rotate(-0 554.4 347.382422)">G4 · Completion và trạng thái quy trình</text>
   </g>
   <g id="text_18">
    <text style="fill: #172338; font: 11.2px 'DejaVu Sans'; text-anchor: start" x="554.4" y="371.0105" transform="rotate(-0 554.4 371.0105)">P08 PHGC · P13 IndustReal / PSR · P14 Action Completion</text>
   </g>
   <g id="text_19">
    <text style="fill: #172338; font: 11.2px 'DejaVu Sans'; text-anchor: start" x="554.4" y="386.1305" transform="rotate(-0 554.4 386.1305)">P19 PROVIA</text>
   </g>
   <g id="text_20">
    <text style="fill: #172338; font: 10.8px 'DejaVu Sans'; text-anchor: start" x="554.4" y="410.422219" transform="rotate(-0 554.4 410.422219)">Xử lý: Verification, hoàn tất bước, completion moment, lỗi/state.</text>
   </g>
   <g id="text_21">
    <text style="fill: #526277; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="554.4" y="440.385234" transform="rotate(-0 554.4 440.385234)">Giới hạn: Đầu ra và quyền nhìn dữ liệu của bốn bài khác nhau.</text>
   </g>
   <g id="text_22">
    <text style="fill: #d97706; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="43.2" y="505.782422" transform="rotate(-0 43.2 505.782422)">G5 · Grounding theo ngôn ngữ</text>
   </g>
   <g id="text_23">
    <text style="fill: #172338; font: 11.2px 'DejaVu Sans'; text-anchor: start" x="43.2" y="529.4105" transform="rotate(-0 43.2 529.4105)">P04 Event Memory · P09 Bayesian-VSLNet</text>
   </g>
   <g id="text_24">
    <text style="fill: #172338; font: 10.8px 'DejaVu Sans'; text-anchor: start" x="43.2" y="568.450969" transform="rotate(-0 43.2 568.450969)">Xử lý: Tìm interval theo query; event memory hoặc order prior.</text>
   </g>
   <g id="text_25">
    <text style="fill: #526277; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="43.2" y="598.785234" transform="rotate(-0 43.2 598.785234)">Giới hạn: P04 online; P09 offline. Cần query/step description.</text>
   </g>
   <g id="text_26">
    <text style="fill: #475569; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="554.4" y="506.290781" transform="rotate(-0 554.4 506.290781)">G6 · Nền xác suất theo thời gian</text>
   </g>
   <g id="text_27">
    <text style="fill: #172338; font: 11.2px 'DejaVu Sans'; text-anchor: start" x="554.4" y="529.4105" transform="rotate(-0 554.4 529.4105)">P15 BOCPD · P16 HDP-HSMM · P17 Robust BOCPD</text>
   </g>
   <g id="text_28">
    <text style="fill: #172338; font: 10.8px 'DejaVu Sans'; text-anchor: start" x="554.4" y="568.450969" transform="rotate(-0 554.4 568.450969)">Xử lý: Changepoint, run length, duration, robust filtering.</text>
   </g>
   <g id="text_29">
    <text style="fill: #526277; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="554.4" y="598.909102" transform="rotate(-0 554.4 598.909102)">Giới hạn: Không có sẵn ngữ nghĩa goal; P16 không là online filter.</text>
   </g>
   <g id="text_30">
    <text style="fill: #be185d; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="43.2" y="664.948125" transform="rotate(-0 43.2 664.948125)">G7 · Biểu diễn và chuyển góc nhìn</text>
   </g>
   <g id="text_31">
    <text style="fill: #172338; font: 11.2px 'DejaVu Sans'; text-anchor: start" x="43.2" y="687.8105" transform="rotate(-0 43.2 687.8105)">P21 Unseen-view TAS</text>
   </g>
   <g id="text_32">
    <text style="fill: #172338; font: 10.8px 'DejaVu Sans'; text-anchor: start" x="43.2" y="726.850969" transform="rotate(-0 43.2 726.850969)">Xử lý: Representation và protocol unseen-view TAS.</text>
   </g>
   <g id="text_33">
    <text style="fill: #526277; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="43.2" y="757.185234" transform="rotate(-0 43.2 757.185234)">Giới hạn: Cần dữ liệu nhiều view train; chưa chứng minh causal.</text>
   </g>
   <g id="text_34">
    <text style="fill: #9a3412; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="554.4" y="663.965156" transform="rotate(-0 554.4 663.965156)">G8 · Metric và chẩn đoán lỗi</text>
   </g>
   <g id="text_35">
    <text style="fill: #172338; font: 11.2px 'DejaVu Sans'; text-anchor: start" x="554.4" y="687.8105" transform="rotate(-0 554.4 687.8105)">P20 WARI / SMS · P22 Affiliation Metrics · P23 Range P/R</text>
   </g>
   <g id="text_36">
    <text style="fill: #172338; font: 10.8px 'DejaVu Sans'; text-anchor: start" x="554.4" y="726.850969" transform="rotate(-0 554.4 726.850969)">Xử lý: WARI/SMS, affiliation, range precision/recall.</text>
   </g>
   <g id="text_37">
    <text style="fill: #526277; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="554.4" y="757.263164" transform="rotate(-0 554.4 757.263164)">Giới hạn: Không thay identity matching hoặc thời điểm phát event.</text>
   </g>
   <g id="text_38">
    <text style="fill: #526277; font: 11px 'DejaVu Sans'; text-anchor: start" x="28.8" y="820.169297" transform="rotate(-0 28.8 820.169297)">Cạnh = thuộc nhóm nghiên cứu; không phải quan hệ trích dẫn hoặc module đã ghép thành hệ thống.</text>
   </g>
   <g id="text_39">
    <text style="fill: #526277; font: 10px 'DejaVu Sans'; text-anchor: start" x="28.8" y="838.246875" transform="rotate(-0 28.8 838.246875)">Khảo sát v0.1 · 2026-11-13 · phạm vi/nguồn: docs/paper_map.md</text>
   </g>
  </g>
 </g>
